name: Pipeline CI/CD - Ruta Express

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  CI:
    name: CI - Integración Continua
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas evidently

      - name: Ejecutar pruebas unitarias
        run: pytest tests/

      - name: Ejecutar validador de datos
        run: python src/validador.py

      - name: Generar informe web
        run: python src/generar_informe.py

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  CD:
    name: CD - Despliegue Continuo
    runs-on: ubuntu-latest
    needs: CI

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
